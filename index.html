<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000">
<title>비밀노트</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="home-view">
<main>
<section class="workspace">
<div class="section-heading"><h2>내 과목 <span id="subject-count"></span></h2></div>
<div id="subjects" class="subjects" aria-label="과목 목록"></div>
<div id="empty-subject" hidden></div>
<div id="subject-content" hidden>
<div class="subject-heading"><div><p class="eyebrow">공부 자료</p><h2 id="subject-title"></h2></div></div>

<section id="notes-panel"><input id="note-search" type="search" aria-label="노트 검색" placeholder="문제·보기 검색 (초성 가능)"><button id="reset-hidden-notes" class="text-button">새로고침</button><div id="notes"></div><button id="start-review" class="review-launch">카드로 확인하기 →</button></section>
<section id="pdf-panel" hidden><input id="pdf-upload" type="file" hidden disabled><form id="search-form" class="search-box"><input id="search-query" placeholder="단어·초성·문제를 입력하세요" required aria-label="교재 검색"><button class="primary">검색</button></form><label class="pdf-expand-option"><input id="pdf-expand" type="checkbox"> PDF 펼치기</label><p id="search-status" role="status"></p><div id="results"></div><h3 class="library-heading">자료 목록</h3><div id="documents"></div></section>
<nav class="tabs" aria-label="과목 메뉴"><button data-tab="notes" class="active">문제 <span id="note-count">0</span></button><button data-tab="pdf">PDF <span id="pdf-count">0</span></button></nav>
</div>
</section>
</main>
</div>
<dialog id="subject-dialog"><form id="subject-form"><div class="dialog-heading"><h2>새 과목</h2><button type="button" class="close-dialog" aria-label="닫기">✕</button></div><label>과목 이름<input id="subject-name" required maxlength="60" placeholder="예: 전기 기초"></label><button class="primary full">과목 만들기</button></form></dialog>
<dialog id="note-dialog"><form id="note-form"><div class="dialog-heading"><h2 id="note-dialog-title">노트 추가</h2><button type="button" class="close-dialog" aria-label="닫기">✕</button></div><label>노트 형식<select id="note-type"><option value="qa">문답</option><option value="choice">객관식 · 4지선다</option><option value="ox">O/X · 참거짓</option><option value="memo">일반 노트</option></select></label><label><span id="question-label">질문</span><textarea id="question" required rows="3" placeholder="기억하고 싶은 질문을 적어주세요"></textarea></label><div id="choices-editor" hidden></div><label id="answer-label">답 / 전체 해설<textarea id="answer" rows="4" placeholder="핵심 내용과 설명을 적어주세요"></textarea></label><button class="primary full">저장하기</button></form></dialog>
<section id="review" hidden aria-label="카드 화면"><div class="review-top"><button id="exit-review">종료</button><span id="review-progress"></span></div><div id="review-card" tabindex="0" aria-label="왼쪽 이전 카드, 오른쪽 다음 카드"><h2 id="review-question"></h2><div id="review-answer"></div></div></section>
<div id="conceal" hidden aria-label="검정 화면. 오른쪽 위 또는 아래 모서리를 누르면 복귀"></div>
<dialog id="pdf-dialog"><div class="dialog-heading"><h2 id="pdf-title">PDF</h2><button class="close-dialog" aria-label="닫기">✕</button></div><div class="pdf-controls"><button id="pdf-prev">←</button><span id="pdf-page"></span><button id="pdf-next">→</button></div><div id="pdf-canvas-wrap"><canvas id="pdf-canvas"></canvas></div><p id="pdf-error" role="status"></p></dialog>
<dialog id="csv-dialog"><div class="dialog-heading"><h2 id="csv-title">실습 데이터</h2><button class="close-dialog" aria-label="닫기">✕</button></div><p id="csv-description" class="hint"></p><div class="csv-table-wrap"><table id="csv-table"></table></div><a id="csv-download" class="subtle" download>CSV 원본 다운로드 ↓</a></dialog>
<div id="toast" role="status" hidden></div>
<script type="module" src="app.js"></script>
</body></html>
